# NKZ login theme — extends Keycloak.v2 (PatternFly 5). Do not fork parent templates;
# use footer.ftl hook and CSS overrides so upstream template updates keep applying.
parent=keycloak.v2

# Light NKZ UI only (parent keycloak.v2 defaults to darkMode=true + OS-driven dark class).
darkMode=false

# Append branding stylesheet after upstream login styles.
styles=css/styles.css css/nkz.css
