<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Code - Nekazari</title>
    <style>
        body {{
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
        }}
        .container {{
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }}
        .header {{
            background-color: #0f172a;
            padding: 24px;
            text-align: center;
        }}
        .header img {{
            height: 40px;
        }}
        .content {{
            padding: 32px;
            text-align: center;
        }}
        .title {{
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #0f172a;
        }}
        .message {{
            font-size: 16px;
            color: #475569;
            margin-bottom: 24px;
        }}
        .otp-box {{
            background-color: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 24px;
            margin: 24px 0;
        }}
        .otp-code {{
            font-family: monospace;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #0ea5e9;
        }}
        .warning {{
            font-size: 14px;
            color: #64748b;
            margin-top: 24px;
        }}
        .footer {{
            background-color: #f8fafc;
            padding: 24px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{NKZ_URL}/logo-light.svg" alt="Nekazari" onerror="this.src='https://raw.githubusercontent.com/nkz-os/nkz/main/apps/host/public/logo-light.svg'">
        </div>
        <div class="content">
            <div class="title">Verify your email address</div>
            <div class="message">
                Use the following code to complete your registration on Nekazari.
            </div>
            <div class="otp-box">
                <div class="otp-code">{OTP}</div>
            </div>
            <div class="warning">
                This code will expire in <strong>15 minutes</strong>.<br>
                If you did not request this code, you can safely ignore this email.
            </div>
        </div>
        <div class="footer">
            &copy; {YEAR} Nekazari OS. Open Source Project.<br>
            Robotika Cloud · Precision Agriculture
        </div>
    </div>
</body>
</html>
