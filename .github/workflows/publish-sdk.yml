name: Publish Packages to npm

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to publish (space-separated, default: all)"
        required: false
        default: "sdk ui-kit viewer-kit design-tokens module-builder"
  push:
    branches:
      - main
    paths:
      - "packages/sdk/**"
      - "packages/ui-kit/**"
      - "packages/viewer-kit/**"
      - "packages/design-tokens/**"
      - "packages/module-builder/**"
      - "packages/module-kit/**"
      - ".github/workflows/publish-sdk.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - sdk
          - ui-kit
          - viewer-kit
          - design-tokens
          - module-builder
          - module-kit
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build module-kit first (codegen.ts needs its types)
        # @nekazari/module-builder declares @nekazari/module-kit as a devDep
        # (with peerDep for the published contract), and pnpm's `^...` filter
        # only follows runtime dependencies, so it would not build module-kit
        # before module-builder in the matrix and tsc fails resolving
        # `import type { ModuleDefinition } from '@nekazari/module-kit'` in
        # packages/module-builder/src/codegen.ts.
        if: matrix.package == 'module-builder'
        run: pnpm --filter @nekazari/module-kit build

      - name: Build package (with workspace deps)
        run: pnpm --filter '@nekazari/${{ matrix.package }}^...' build

      - name: Check if version is already published
        id: check
        run: |
          PKG_NAME=$(node -p "require('./packages/${{ matrix.package }}/package.json').name")
          PKG_VERSION=$(node -p "require('./packages/${{ matrix.package }}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} already published, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} not found on npm, will publish"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        # --provenance requires Trusted Publishing (OIDC) to be configured per
        # package on npmjs.com (Settings → Trusted Publishers → add this repo +
        # workflow). Until that is set up for the @nekazari scope, classic
        # token-based publishing is used. To re-enable: configure Trusted
        # Publishing on each package, then add `--provenance` back.
        run: pnpm --filter @nekazari/${{ matrix.package }} publish --access=public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
