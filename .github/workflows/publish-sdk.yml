name: Publish Packages to npm

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to publish (space-separated, default: all)"
        required: false
        default: "sdk ui-kit viewer-kit design-tokens module-builder"
  push:
    branches:
      - main
    paths:
      - "packages/sdk/**"
      - "packages/ui-kit/**"
      - "packages/viewer-kit/**"
      - "packages/design-tokens/**"
      - "packages/module-builder/**"
      - "packages/module-kit/**"
      - ".github/workflows/publish-sdk.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - sdk
          - ui-kit
          - viewer-kit
          - design-tokens
          - module-builder
          - module-kit
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build module-kit first (codegen.ts needs its types)
        # @nekazari/module-builder declares @nekazari/module-kit as a devDep
        # (with peerDep for the published contract), and pnpm's `^...` filter
        # only follows runtime dependencies, so it would not build module-kit
        # before module-builder in the matrix and tsc fails resolving
        # `import type { ModuleDefinition } from '@nekazari/module-kit'` in
        # packages/module-builder/src/codegen.ts.
        if: matrix.package == 'module-builder'
        run: pnpm --filter @nekazari/module-kit build

      - name: Build package (with workspace deps)
        run: pnpm --filter '@nekazari/${{ matrix.package }}^...' build

      - name: Check if version is already published
        id: check
        run: |
          PKG_NAME=$(node -p "require('./packages/${{ matrix.package }}/package.json').name")
          PKG_VERSION=$(node -p "require('./packages/${{ matrix.package }}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} already published, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} not found on npm, will publish"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (Trusted Publishing + provenance)
        if: steps.check.outputs.exists == 'false'
        # Trusted Publishing is configured per package on npmjs.com
        # (Settings → Trusted Publishers → GitHub Actions, repo=nkz-os/nkz,
        # workflow=publish-sdk.yml, no environment). With it, npm derives
        # the publish identity from the workflow's OIDC token at runtime.
        # --provenance signs the release with a public SLSA attestation.
        #
        # We must use `npm publish` (not `pnpm publish`) for the OIDC flow:
        # only npm CLI v11.5+ exchanges the ACTIONS_ID_TOKEN_REQUEST_* env
        # for a short-lived npm publish token. Node 22 ships npm 10.x, so
        # we invoke the latest npm via `npx -p npm@latest -y` rather than
        # upgrading the global npm (which fails with MODULE_NOT_FOUND while
        # rebuilding itself in-place).
        #
        # NODE_AUTH_TOKEN cleared so the .npmrc placeholder resolves to
        # empty; npm then takes the OIDC path because id-token: write is
        # granted on this job.
        working-directory: packages/${{ matrix.package }}
        run: npx -p npm@latest -y npm publish --access=public --provenance
        env:
          NODE_AUTH_TOKEN: ""
