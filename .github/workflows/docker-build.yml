name: Build and Push Docker Images

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Explicit permissions for GHCR
permissions:
  contents: read
  packages: write

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests httpx pytest-timeout pyjwt flask cryptography shapely
          pip install -r services/api-gateway/requirements.txt 2>/dev/null || true
          pip install -r services/weather-worker/requirements.txt 2>/dev/null || true
          pip install -r services/entity-manager/requirements.txt 2>/dev/null || true

      - name: Run unit tests
        env:
          PYTHONPATH: services
        run: |
          python3 -m pytest services/tests/ \
            -v --tb=short --timeout=30 \
            -m "not orion_integration and not pg_integration" \
            --no-header

  build-and-push:
    runs-on: ubuntu-latest
    needs: [backend-unit-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core API Services
          - service: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - service: entity-manager
            context: .
            dockerfile: services/entity-manager/Dockerfile

          # Tenant Management
          - service: tenant-user-api
            context: .
            dockerfile: services/tenant-user-api/Dockerfile
          - service: tenant-webhook
            context: .
            dockerfile: services/tenant-webhook/Dockerfile

          # Workers & Data Processing
          - service: weather-worker
            context: .
            dockerfile: services/weather-worker/Dockerfile
          - service: weather-api
            context: .
            dockerfile: services/weather-api/Dockerfile
          - service: telemetry-worker
            context: .
            dockerfile: services/telemetry-worker/Dockerfile
          - service: timeseries-reader
            context: .
            dockerfile: services/timeseries-reader/Dockerfile
          - service: sensor-health-beat
            context: .
            dockerfile: services/sensor-health-beat/Dockerfile

          # Integrations
          - service: sdm-integration
            context: .
            dockerfile: services/sdm-integration/Dockerfile
          - service: email-service
            context: .
            dockerfile: services/email-service/Dockerfile
          - service: mqtt-credentials-manager
            context: .
            dockerfile: services/mqtt-credentials-manager/Dockerfile

          # Risk Management
          - service: risk-api
            context: .
            dockerfile: services/risk-api/Dockerfile
          - service: risk-orchestrator
            context: .
            dockerfile: services/risk-orchestrator/Dockerfile
          - service: risk-worker
            context: .
            dockerfile: services/risk-worker/Dockerfile
          # Frontend
          - service: host
            context: .
            dockerfile: apps/host/Dockerfile

          # Identity (matches production: services/keycloak/Dockerfile + PG driver + themes)
          - service: keycloak
            context: .
            dockerfile: services/keycloak/Dockerfile

          # SDK — base image for module backends (Python 3.11 + nkz-platform-sdk)
          - service: module-base
            context: .
            dockerfile: services/nkz-platform-sdk/Dockerfile

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Push Docker image
        if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/backend-security-standards')) || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
