# Ensures Timescale migration files stay present and ordered when migrations/ changes.
# Does NOT apply SQL to any database (production applies are manual / ops — see DEPLOYMENT.md).

name: Database migrations

on:
  push:
    branches: ["main"]
    paths:
      - "config/timescaledb/migrations/**"
      - "config/timescaledb/rls_forced_tables.txt"
      - ".github/scripts/check_rls_ratchet.py"
      - ".github/workflows/db-migrations.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "config/timescaledb/migrations/**"
      - "config/timescaledb/rls_forced_tables.txt"
      - ".github/scripts/check_rls_ratchet.py"
      - ".github/workflows/db-migrations.yml"

permissions:
  contents: read

jobs:
  verify-migrations:
    name: Verify migration tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Count SQL migrations
        run: |
          set -e
          n=$(find config/timescaledb/migrations -maxdepth 1 -name '*.sql' -type f | wc -l)
          echo "MIGRATION_COUNT=$n"
          test "$n" -ge 1

      - name: Require 062 telemetry index (timeseries-reader v2)
        run: test -f config/timescaledb/migrations/062_telemetry_events_tenant_device_time_index.sql

      - name: List last migrations (version sort)
        run: ls -1 config/timescaledb/migrations/*.sql | sort -V | tail -8

  rls-ratchet:
    name: RLS ratchet (owners, policies, forced list only grows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the ratchet check
        run: python3 .github/scripts/check_rls_ratchet.py --base "${{ steps.base.outputs.ref }}"

      - name: Unit tests of the check
        run: python3 -m pytest .github/scripts/tests/test_check_rls_ratchet.py -q
