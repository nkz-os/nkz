# Reusable public-repo hygiene check.
#
# Every repo in this organisation is public and installable, so none of them may
# name a deployment. The check and its list of permitted hosts live here, in one
# place: a module repo calls this workflow and inherits every later improvement
# without a change of its own. It carries two checks: operational detail in the
# diff (`hygiene`) and NGSI-LD entity types outside the closed list (`entity-types`).
#
# Caller:
#   jobs:
#     hygiene:
#       uses: nkz-os/nkz/.github/workflows/_public-repo-hygiene.yml@main
#       secrets: inherit   # passes the organisation's HYGIENE_PRIVATE_TERMS

name: Public Repo Hygiene

on:
  workflow_call:
    inputs:
      ack_marker:
        description: Commit-message marker that acknowledges a deliberate addition.
        type: string
        default: "[prod-refs-ack]"
    secrets:
      HYGIENE_PRIVATE_TERMS:
        description: Comma-separated private terms (organisation secret).
        required: false

jobs:
  hygiene:
    name: Public Repo Hygiene
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A reusable workflow runs the caller's checkout, not its own repository's
      # files, so the checker and the host list are fetched explicitly.
      - name: Check out the checker
        uses: actions/checkout@v7
        with:
          repository: nkz-os/nkz
          ref: main
          sparse-checkout: .github
          path: .hygiene-tooling

      - name: Check for operational detail in the diff
        env:
          HYGIENE_PRIVATE_TERMS: ${{ secrets.HYGIENE_PRIVATE_TERMS }}
        run: |
          set +e
          if [ -z "$HYGIENE_PRIVATE_TERMS" ]; then
            echo "::warning title=Private terms not checked::HYGIENE_PRIVATE_TERMS is not passed to this workflow; call it with 'secrets: inherit'."
          fi
          BASE="${GITHUB_BASE_REF:-main}"
          if ! git fetch origin "$BASE" --depth=1 2>/dev/null; then
            if ! git fetch origin main --depth=1 2>/dev/null; then
              echo "Could not fetch the base branch; nothing to compare."
              exit 0
            fi
            BASE="main"
          fi

          DIFF=$(git diff "origin/$BASE...HEAD" -- \
            ':(exclude)*.svg' ':(exclude)*.png' ':(exclude)*.jpg' \
            ':(exclude)*.gif' ':(exclude)*.ico' ':(exclude)*.lock' \
            ':(exclude)pnpm-lock.yaml' ':(exclude).hygiene-tooling' \
            2>/dev/null || true)
          if [ -z "$DIFF" ]; then
            echo "No diff to check."
            exit 0
          fi

          RESULTS=$(printf '%s' "$DIFF" | python3 \
            .hygiene-tooling/.github/scripts/check_public_repo_hygiene.py 2>&1)
          STATUS=$?
          [ $STATUS -eq 0 ] && { echo "$RESULTS"; exit 0; }

          # A private finding cannot be acknowledged.
          if [ $STATUS -eq 2 ]; then
            echo "::error title=Private Term Detected::This diff adds a private term. Remove it."
            echo "$RESULTS"
            exit 1
          fi

          # The whole PR range: on pull_request events HEAD is the generated
          # merge commit, which never carries the marker.
          COMMIT_MSG=$(git log "origin/$BASE..HEAD" --format=%s%n%b 2>/dev/null || true)
          if echo "$COMMIT_MSG" | grep -qF '${{ inputs.ack_marker }}'; then
            echo "Acknowledged via ${{ inputs.ack_marker }}:"
            echo "$RESULTS"
            exit 0
          fi

          echo "::error title=Operational Detail Detected::This diff names a deployment. Addresses and identifiers belong in configuration."
          echo "$RESULTS"
          exit 1

  entity-types:
    name: Entity Types
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The checker and the type lists live in nkz; the caller's checkout has neither.
      - name: Check out the checker and the lists
        uses: actions/checkout@v7
        with:
          repository: nkz-os/nkz
          ref: main
          sparse-checkout: |
            .github
            config/entity-types
          path: .hygiene-tooling

      - name: Check entity types in the diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set +e
          if [ "$EVENT_NAME" = "push" ]; then
            # A new branch has an all-zero "before"; a shallow or rewritten
            # history may not contain it. Neither can be compared.
            if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "::notice title=Entity types not checked::New branch: nothing to compare against."
              exit 0
            fi
            if ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              echo "::warning title=Entity types not checked::The previous commit of this push is not available."
              exit 0
            fi
            RANGE="$PUSH_BEFORE..HEAD"
          else
            BASE="${GITHUB_BASE_REF:-main}"
            if ! git fetch origin "$BASE" --depth=1 2>/dev/null; then
              if ! git fetch origin main --depth=1 2>/dev/null; then
                echo "::warning title=Entity types not checked::Could not fetch the base branch."
                exit 0
              fi
              BASE="main"
            fi
            RANGE="origin/$BASE...HEAD"
          fi

          # The script filters paths itself, so the diff is passed whole.
          # A checker failure must not block the calling repositories, but it
          # must not be silent either.
          DIFF=$(git diff "$RANGE" 2>/dev/null)
          if [ $? -ne 0 ]; then
            echo "::warning title=Entity types not checked::Could not compute the diff for this change."
            exit 0
          fi
          printf '%s' "$DIFF" | python3 .hygiene-tooling/.github/scripts/check_entity_types.py diff \
            --lists .hygiene-tooling/config/entity-types
          STATUS=$?
          # 0 clean, 1 findings; anything else is the checker failing, not the caller.
          if [ $STATUS -le 1 ]; then
            exit $STATUS
          fi
          echo "::warning title=Entity types not checked::The checker could not run."
          exit 0
