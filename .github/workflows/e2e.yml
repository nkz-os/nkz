name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/host/**'
      - 'services/api-gateway/**'
      - 'services/entity-manager/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'packages/sdk/**'
      - 'packages/module-kit/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build core images
        run: |
          docker compose build \
            api-gateway entity-manager keycloak frontend \
            --build-arg BUILDKIT_INLINE_CACHE=1

      - name: Start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          # Wait for frontend + API (--wait fails on run-once init containers)
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 80); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Frontend healthy after $((i * 3))s"
              break
            fi
            sleep 3
          done

      - name: Verify health
        run: |
          echo "--- Containers ---"
          docker compose ps
          curl -sf http://localhost:3000/health

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/host
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: apps/host
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/host/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
