<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NKZ Dev Shell</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    #dev-banner { background: #1e293b; border-bottom: 1px solid #334155; padding: 8px 16px; font-size: 13px; display: flex; gap: 16px; align-items: center; }
    #dev-banner .module { color: #38bdf8; font-weight: 600; }
    #dev-banner .badge { background: #166534; color: #4ade80; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    #root { padding: 24px; }
  </style>
</head>
<body>
  <div id="dev-banner">
    <span class="module">Module Dev Shell</span>
    <span class="badge">HMR active</span>
    <span style="margin-left:auto;color:#94a3b8;font-size:12px">Lightweight host — dev only</span>
  </div>
  <div id="root"></div>
  <script type="module">
    window.__NKZ__ = {
      version: 'dev',
      register(mod) {
        console.log('[NKZ Dev] Module registered:', mod.id);
        if (mod.main && document.getElementById('root')) {
          window.ReactDOM.createRoot(document.getElementById('root'))
            .render(window.React.createElement(mod.main));
        }
      },
      onRegister(cb) { this._cb = cb; },
      _registered: new Map(),
      _listeners: new Set(),
    };
    window.__nekazariAuthContext = {
      isAuthenticated: true,
      tenantId: 'dev-tenant',
      roles: ['PlatformAdmin', 'TenantAdmin', 'Farmer'],
      user: { username: 'dev', email: 'dev@nekazari.local', roles: ['PlatformAdmin'] },
    };
  </script>
  <script type="module" src="MODULE_BUNDLE_URL"></script>
</body>
</html>
