# =============================================================================
# Orion-LD Deployment - Context Broker FIWARE
# =============================================================================
# TRoE (Temporal Representation of Entities) ENABLED 2026-06-25.
# Writes entity history to PostgreSQL/TimescaleDB alongside MongoDB.
# CLI args (-troe*) required — env vars TROE_* NOT recognized by Orion 1.5.1.
# Credentials: orion user with CREATEDB on PostgreSQL (idempotent setup via
# postgresql-init or manual CREATE USER + CREATE DATABASE + initial.sql).
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-ld
  namespace: nekazari
  labels:
    app: orion-ld
    layer: apis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-ld
  template:
    metadata:
      labels:
        app: orion-ld
        layer: apis
    spec:
      serviceAccountName: api-gateway-sa
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: orion-ld
        image: fiware/orion-ld:1.5.1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 1026
        args:
        # TRoE — PostgreSQL backend for temporal entity history
        # WARNING: Orion-LD 1.5.1 only reads TRoE config via CLI args, not env vars.
        - -troe
        - -troeHost
        - postgresql-service
        - -troePort
        - "5432"
        - -troeUser
        - orion
        - -troePwd
        - orion
        env:
        # ===========================================
        # Multi-tenancy configuration (CRITICAL)
        # ===========================================
        - name: ORIONLD_MULTI_TENANCY
          value: "TRUE"
        # ===========================================
        # MongoDB connection
        # ===========================================
        - name: ORIONLD_MONGO_HOST
          value: mongodb-service
        - name: ORIONLD_MONGO_PORT
          value: "27017"
        - name: ORIONLD_MONGO_DB
          value: orion
        - name: ORIONLD_MONGO_AUTH_SOURCE
          value: authSource=admin
        - name: ORIONLD_MONGO_USER
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: root-username
        - name: ORIONLD_MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: root-password
        - name: ORIONLD_MONGO_URI
          value: ""  # Empty to force use of separate variables
        livenessProbe:
          httpGet:
            path: /version
            port: 1026
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /version
            port: 1026
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            memory: "384Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: orion-ld-service
  namespace: nekazari
  labels:
    app: orion-ld
    layer: apis
spec:
  type: ClusterIP
  selector:
    app: orion-ld
  ports:
  - port: 1026
    targetPort: 1026
    protocol: TCP
    name: http
