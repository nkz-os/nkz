# =============================================================================
# Core API Services Deployments - Nekazari
# =============================================================================
# Servicios CORE esenciales para la operación básica de la plataforma
# Incluye: API Gateway, Entity Manager
# =============================================================================

---
# API Gateway
# Punto de entrada único para todas las APIs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nekazari
  labels:
    app: api-gateway
    layer: core
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        layer: core
        component: api
      annotations:
        platform.example.com/last-deployed: "2026-03-13T19:55:00Z"
        platform.example.com/change-reason: "Fix admin routing and auth cookie extraction"
    spec:
      serviceAccountName: api-gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/nkz-os/nkz/api-gateway@sha256:39fea383d000925c7870a25cab2962eb56337371ae23398625f85dc1a16e9760  # main b11d1e5: AgriParcel single-writer enforcement
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: ORION_URL
              value: http://orion-ld-service:1026
            - name: KEYCLOAK_URL
              value: http://keycloak-service:8080/auth
            - name: KEYCLOAK_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: nekazari-config
                  key: KEYCLOAK_PUBLIC_URL
            - name: KEYCLOAK_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: nekazari-config
                  key: KEYCLOAK_HOSTNAME
            - name: KEYCLOAK_REALM
              value: "nekazari"
            - name: CONTEXT_URL
              valueFrom:
                configMapKeyRef:
                  name: nekazari-config
                  key: CONTEXT_URL
            - name: ALLOW_JWT_FALLBACK
              value: "false"
            - name: GEOSERVER_URL
              value: http://geoserver-service:8080
            - name: TENANT_WEBHOOK_URL
              value: http://tenant-webhook-service:8080
            - name: NDVI_SERVICE_URL
              value: http://entity-manager-service:5000
            - name: ENTITY_MANAGER_URL
              value: http://entity-manager-service:5000
            - name: SOIL_API_URL
              value: http://soil-module-service:8000
            - name: DATAHUB_BFF_URL
              value: http://datahub-api-service:8000
            - name: TENANT_USER_API_URL
              value: http://tenant-user-api-service:5000
            - name: GEOCODE_URL
              value: https://photon.komoot.io
            # ADR 003 — PAT + Keycloak client credentials (optional until secrets exist)
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
                  optional: true
            - name: MINIO_ENDPOINT
              value: "minio-service:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            - name: GATEWAY_KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: api-gateway-keycloak-secret
                  key: client-id
                  optional: true
            - name: GATEWAY_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-keycloak-secret
                  key: client-secret
                  optional: true
            - name: INTERNAL_PAT_VALIDATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pat-internal-secret
                  key: secret
                  optional: true
            - name: ZULIP_SERVICE_URL
              value: "http://zulip-service:80"
            - name: ZULIP_BOT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: zulip-secret
                  key: bot-email
            - name: ZULIP_BOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zulip-secret
                  key: bot-api-key
            - name: ZULIP_PROVISIONER_URL
              value: "http://zulip-provisioner-service:5000"
            - name: ZULIP_HOST
              valueFrom:
                configMapKeyRef:
                  name: core-zulip-messaging-config
                  key: external-host
            - name: REQUESTS_PER_MINUTE
              value: "600"
            - name: CARBON_API_URL
              value: "http://carbon-api-service:8000"
            - name: MODULE_GATEWAY_ENABLED
              value: "vegetation-health,gis-routing,cue,nkz-module-eu-elevation"
          command: ["gunicorn"]
          args:
            [
              "--bind",
              "0.0.0.0:5000",
              "--workers",
              "2",
              "--threads",
              "2",
              "--timeout",
              "60",
              "--access-logfile",
              "-",
              "--error-logfile",
              "-",
              "fiware_api_gateway:app",
            ]
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: nekazari
  labels:
    app: api-gateway
    layer: core
spec:
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000

---
# Entity Manager
# Gestión de entidades NGSI-LD (Digital Twins)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entity-manager
  namespace: nekazari
  labels:
    app: entity-manager
    layer: core
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: entity-manager
  template:
    metadata:
      labels:
        app: entity-manager
        layer: core
        component: api
      annotations:
        platform.example.com/last-deployed: "2026-03-13T19:55:00Z"
        platform.example.com/change-reason: "Fix admin routing and auth cookie extraction"
    spec:
      serviceAccountName: entity-manager-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: entity-manager
          image: ghcr.io/nkz-os/nkz/entity-manager@sha256:87b8af9d6b3a03b93a797d1d73f94cd6dbfc311a19faae08c75f5985b1a3766e  # main b11d1e5: parcel CRUD + urllib3 pin + mjs MIME + reconcile zone assessment
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: ALLOW_JWT_FALLBACK
              value: "false"
            - name: REQUIRE_HMAC_SIGNATURE
              value: "true"
            - name: ORION_URL
              value: http://orion-ld-service:1026
            - name: KEYCLOAK_URL
              value: http://keycloak-service:8080/auth
            - name: KEYCLOAK_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: nekazari-config
                  key: KEYCLOAK_PUBLIC_URL
                  optional: true
            - name: KEYCLOAK_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: nekazari-config
                  key: KEYCLOAK_HOSTNAME
                  optional: true
            - name: KEYCLOAK_REALM
              value: "nekazari"
            - name: GRAFANA_OAUTH_CLIENT_ID
              value: "nekazari-frontend"
            - name: PRODUCTION_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: nekazari-config
                  key: PRODUCTION_DOMAIN
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-url
            - name: NDVI_QUEUE_NAME
              value: "ndvi"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
                  optional: true
            - name: GRAFANA_URL
              value: http://grafana-service:3000
            - name: GRAFANA_ADMIN_USER
              value: admin
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-password
            - name: MQTT_HOST
              value: mosquitto-service
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: iot-agent-username
                  optional: true
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: iot-agent-password
                  optional: true
            - name: BLOB_READ_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vercel-blob-secret
                  key: blob-read-write-token
                  optional: true
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            - name: S3_ENDPOINT_URL
              value: "http://minio-service:9000"
            - name: ASSETS_BUCKET
              value: "assets-3d"
            - name: ASSETS_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: core-static-assets-config
                  key: STATIC_ASSETS_URL
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: INTERNAL_SERVICE_SECRET
            - name: NKZ_PUBLISH_SECRET
              valueFrom:
                secretKeyRef:
                  name: nkz-publish-secret
                  key: NKZ_PUBLISH_SECRET
            - name: MODULE_LIFECYCLE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: module-lifecycle-secret
                  key: LIFECYCLE_WEBHOOK_SECRET
          args: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "1", "--timeout", "300", "entity_management_api:app"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: entity-manager-service
  namespace: nekazari
  labels:
    app: entity-manager
    layer: core
spec:
  selector:
    app: entity-manager
  ports:
    - port: 5000
      targetPort: 5000
