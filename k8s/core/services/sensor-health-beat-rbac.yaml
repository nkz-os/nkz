---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sensor-health-beat
  namespace: nekazari
  labels:
    app: sensor-health-beat
    layer: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sensor-health-beat
  namespace: nekazari
  labels:
    app: sensor-health-beat
    layer: backend
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sensor-health-beat
  namespace: nekazari
  labels:
    app: sensor-health-beat
    layer: backend
subjects:
  - kind: ServiceAccount
    name: sensor-health-beat
    namespace: nekazari
roleRef:
  kind: Role
  name: sensor-health-beat
  apiGroup: rbac.authorization.k8s.io
