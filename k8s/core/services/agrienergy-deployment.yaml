# =============================================================================
# AgriEnergy Orchestrator - Production Deployment
# =============================================================================
# Deployed from: https://github.com/nkz-os/nkz-module-agrienergy
# Image: ghcr.io/nkz-os/nkz-module-agrienergy/agrienergy-backend:main
# =============================================================================

---
# Deployment: AgriEnergy Orchestrator Backend Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrienergy-backend
  namespace: nekazari
  labels:
    app: agrienergy-backend
    component: backend
    module: agrienergy
    nekazari.io/profile: addon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agrienergy-backend
  template:
    metadata:
      labels:
        app: agrienergy-backend
        component: backend
        module: agrienergy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # No imagePullSecrets: public GHCR images pull anonymously
      containers:
        - name: backend
          # Pinned by digest: :main + pullPolicy Always means any pod restart can
          # silently deploy whatever the module repo's main last built.
          image: ghcr.io/nkz-os/nkz-module-agrienergy/agrienergy-backend@sha256:4ab41786376310323105d08b9c59495c8a7f147150a01a3c1cd43ee7ac786127
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_NAME
              value: "AgriEnergy Orchestrator"
            - name: DEBUG
              value: "false"
            - name: API_PREFIX
              value: "/api/agrienergy"
            # CORS — explicit origin whitelist (never *)
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: core-agrienergy-config
                  key: CORS_ORIGINS
            # Keycloak Configuration
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: core-agrienergy-config
                  key: KEYCLOAK_URL
            - name: KEYCLOAK_REALM
              value: "nekazari"
            - name: JWT_AUDIENCE
              value: "account"
            # Orion-LD URL for creating entities (e.g. AgriSolarPark)
            - name: CONTEXT_BROKER_URL
              value: "http://orion-ld-service:1026/ngsi-ld/v1"
            # NGSI-LD @context for Link headers (SDK OrionClient)
            - name: CONTEXT_URL
              value: "http://api-gateway-service:5000/ngsi-ld-context.json"
            # /notify webhook announced in Orion-LD subscriptions (SubscriptionRegistrar)
            - name: NOTIFICATION_URL
              value: "http://agrienergy-api-service:8000/api/agrienergy/notify"
            # Service-to-service auth (optional)
            - name: MODULE_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: module-secrets
                  key: management-key
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3

---
# Service: AgriEnergy Orchestrator Backend API
apiVersion: v1
kind: Service
metadata:
  name: agrienergy-api-service
  namespace: nekazari
  labels:
    app: agrienergy-backend
    module: agrienergy
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: agrienergy-backend
