apiVersion: batch/v1
kind: CronJob
metadata:
  name: sensor-health-beat
  namespace: nekazari
  labels:
    app: sensor-health-beat
    layer: backend
spec:
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Safety net: a single cycle must finish well within the 15-min schedule.
      # Without this a hung run blocks all future runs (concurrencyPolicy: Forbid).
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: sensor-health-beat
            layer: backend
        spec:
          serviceAccountName: sensor-health-beat
          restartPolicy: OnFailure
          containers:
          - name: sensor-health-beat
            image: ghcr.io/nkz-os/nkz/services/sensor-health-beat:sha-d9b047a9c67bc27e9802072193df47efa14a72a6
            imagePullPolicy: IfNotPresent
            # One-shot: run a single health-check cycle and exit. (Do NOT start
            # the FastAPI server here — it never exits and blocks the schedule.)
            args: ["python3", "-m", "sensor_health_beat"]
            env:
            - name: ORION_URL
              value: "http://orion-ld-service:1026"
            - name: CONTEXT_URL
              value: "http://api-gateway-service:5000/ngsi-ld-context.json"
            - name: TIMESCALE_DSN
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-url
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "500m"
