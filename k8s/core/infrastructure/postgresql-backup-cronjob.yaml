# =============================================================================
# CronJob — Backup de PostgreSQL → SFTP IONOS (cada 6 h)
# =============================================================================
# initContainer hace pg_dumpall (TimescaleDB: el restore requiere
# timescaledb_pre_restore()/post_restore()); el contenedor principal sube el
# dump por SFTP con paramiko (script en ConfigMap backup-upload-script).
#
# Labels del pod: component=backup-sftp habilita la NetworkPolicy
# backup-sftp-egress (gitops-config overlays/core/network-policies/) que
# permite DNS + 443 (PyPI) + 22 (SFTP). Sin ella el egress queda rechazado
# por el baseline y el job falla (incidente 2026-05-24 → 2026-06-11: 18 días
# sin backups, pip fallaba en silencio por el 2>/dev/null).
#
# Credenciales: ionos-sftp-creds (host/user/password/remote_dir) y
# postgresql-secret (POSTGRES_USER/password). Nada hardcodeado.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-backup-sftp
  namespace: nekazari
  labels:
    app: postgresql-backup-sftp
    component: backup-sftp
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: postgresql-backup-sftp
            component: backup-sftp
        spec:
          restartPolicy: OnFailure
          initContainers:
          - name: pgdump
            image: postgres:14-alpine
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting PostgreSQL dump at $(date)"
              pg_dumpall -h "${PG_HOST}" -U "${PG_USER}" -f /backup/backup-nkz-$(date +%Y%m%d-%H%M%S).sql
              cd /backup
              BACKUP_FILE=$(ls backup-nkz-*.sql)
              gzip "$BACKUP_FILE"
              ls -lh /backup/
              echo "Dump complete at $(date)"
            env:
            - name: PG_HOST
              value: "postgresql-service"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: password
            volumeMounts:
            - name: backup-data
              mountPath: /backup
          containers:
          - name: upload
            image: python:3.12-alpine
            command:
            - sh
            - -c
            # Sin redirecciones a /dev/null: si pip falla tiene que verse en
            # los logs y el job debe fallar (fail-safe). -u = sin buffering.
            - |
              set -e
              pip install --no-cache-dir --quiet paramiko
              python3 -u /script/upload.py
            env:
            - name: SFTP_HOST
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: host
            - name: SFTP_USER
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: user
            - name: SFTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: password
            - name: SFTP_DIR
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: remote_dir
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
            - name: backup-data
              mountPath: /backup
            - name: script
              mountPath: /script
              readOnly: true
          volumes:
          - name: backup-data
            emptyDir: {}
          - name: script
            configMap:
              name: backup-upload-script
