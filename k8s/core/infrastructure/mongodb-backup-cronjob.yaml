# =============================================================================
# CronJob — Backup de MongoDB (entidades NGSI-LD de Orion-LD) → SFTP IONOS
# =============================================================================
# initContainer hace mongodump --gzip --archive; el contenedor principal sube
# el archivo por SFTP con paramiko (ConfigMap backup-upload-script).
#
# Labels del pod: component=backup-sftp habilita la NetworkPolicy
# backup-sftp-egress (DNS + 443 PyPI + 22 SFTP). Ver nota de incidente en
# postgresql-backup-cronjob.yaml.
#
# Credenciales: ionos-sftp-creds y mongodb-secret (root-username/
# root-password). Nada hardcodeado.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup-sftp
  namespace: nekazari
  labels:
    app: mongodb-backup-sftp
    component: backup-sftp
spec:
  schedule: "30 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: mongodb-backup-sftp
            component: backup-sftp
        spec:
          restartPolicy: OnFailure
          initContainers:
          - name: mongodump
            image: mongo:7.0
            command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Starting MongoDB dump at $(date)"
              mongodump --host=mongodb-service --port=27017 \
                -u "${MONGO_USER}" -p "${MONGO_PASSWORD}" \
                --authenticationDatabase=admin --gzip \
                --archive=/backup/backup-mongodb-nkz-$(date +%Y%m%d-%H%M%S).archive
              ls -lh /backup/
              echo "Dump complete at $(date)"
            env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: root-password
            volumeMounts:
            - name: backup-data
              mountPath: /backup
          containers:
          - name: upload
            image: python:3.12-alpine
            command:
            - sh
            - -c
            # Sin redirecciones a /dev/null: si pip falla tiene que verse en
            # los logs y el job debe fallar (fail-safe). -u = sin buffering.
            - |
              set -e
              pip install --no-cache-dir --quiet paramiko
              python3 -u /script/upload.py
            env:
            - name: SFTP_HOST
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: host
            - name: SFTP_USER
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: user
            - name: SFTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: password
            - name: SFTP_DIR
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: remote_dir
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
            - name: backup-data
              mountPath: /backup
            - name: script
              mountPath: /script
              readOnly: true
          volumes:
          - name: backup-data
            emptyDir: {}
          - name: script
            configMap:
              name: backup-upload-script
