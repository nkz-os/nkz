# =============================================================================
# CronJob — Limpieza de backups antiguos en IONOS SFTP (semanal, domingo 03:00)
# =============================================================================
# Borra del SFTP remoto los ficheros con más de RETENTION_DAYS días
# (script en ConfigMap cleanup-script).
#
# Labels del pod: component=backup-sftp habilita la NetworkPolicy
# backup-sftp-egress (DNS + 443 PyPI + 22 SFTP). Ver nota de incidente en
# postgresql-backup-cronjob.yaml.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sftp-cleanup
  namespace: nekazari
  labels:
    app: sftp-cleanup
    component: backup-sftp
    layer: ops
spec:
  schedule: "0 3 * * 0"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: sftp-cleanup
            component: backup-sftp
        spec:
          restartPolicy: Never
          containers:
          - name: runner
            image: python:3.12-alpine
            imagePullPolicy: IfNotPresent
            command:
            - sh
            - -c
            # Sin redirecciones a /dev/null: si pip falla tiene que verse en
            # los logs y el job debe fallar (fail-safe). -u = sin buffering.
            - |
              set -e
              pip install --no-cache-dir --quiet paramiko
              python3 -u /script/cleanup.py
            env:
            - name: SFTP_HOST
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: host
            - name: SFTP_USER
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: user
            - name: SFTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: password
            - name: SFTP_DIR
              valueFrom:
                secretKeyRef:
                  name: ionos-sftp-creds
                  key: remote_dir
            - name: RETENTION_DAYS
              value: "30"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
          volumes:
          - name: script
            configMap:
              name: cleanup-script
