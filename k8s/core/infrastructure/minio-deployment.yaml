# =============================================================================
# MinIO Deployment - Object Storage Service
# =============================================================================
# MinIO is deployed as core infrastructure for object storage
# Used by NDVI worker, robotics, and other modules
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: nekazari
  labels:
    app: minio
    layer: infrastructure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        layer: infrastructure
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: minio
        # Pin by digest; prod drifted to :latest for months — this digest is the
        # release running in prod since 2026-06. NEVER :latest (probe-kill restarts
        # re-pull and silently change versions). Downgrading below a version that
        # has written data risks on-disk format incompatibility.
        image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - name: api
          containerPort: 9000
        - name: console
          containerPort: 9001
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        env:
        # Public URL of the S3 API (browser + presigned URLs). Keep in sync with
        # minio-public-ingress / DNS. Internal clients still use http://minio-service:9000.
        - name: MINIO_SERVER_URL
          value: "https://minio.YOUR_DOMAIN"
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: root-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: root-password
        volumeMounts:
        - name: minio-storage
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20
          # 1s timeout + CPU throttling caused chronic false-positive kills
          # (66 restarts/21d) — every kill takes /modules down platform-wide.
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: nekazari
  labels:
    app: minio
    layer: infrastructure
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: nekazari
  labels:
    app: minio
    layer: infrastructure
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path  # Adjust based on your storage class
