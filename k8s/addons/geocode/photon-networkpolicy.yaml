---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: photon-allow-gateway
  namespace: nekazari
spec:
  podSelector:
    matchLabels:
      app: photon
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 2322
