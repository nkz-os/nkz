---
# Idempotent import Job — descarga el extracto Photon planetario desde GraphHQ
# y lo extrae directamente al PVC. Idempotente: skip si photon_data/ ya existe.
# 
# Requisitos:
# - PVC photon-index con suficiente espacio (>95GB para planetario)
# - Tiempo: ~7h a 2.2 MB/s (56GB comprimido)
#
# Fuente: https://download1.graphhopper.com/public/photon-db-planet-master-latest.tar.bz2
apiVersion: batch/v1
kind: Job
metadata:
  name: photon-import
  namespace: nekazari
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: index
          persistentVolumeClaim:
            claimName: photon-index
      containers:
        - name: import
          image: ghcr.io/nkz-os/nkz/photon@sha256:b497ef9cc5905452442df49b7d692c127aeb11f9829a2507a2efddaf854542c2
          volumeMounts:
            - name: index
              mountPath: /photon
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -d /photon/photon_data ]; then
                echo "Índice ya presente, saltando importación"
                exit 0
              fi
              mkdir -p /photon/photon_data
              echo "Descargando e importando base de datos Photon planetaria..."
              echo "URL: https://download1.graphhopper.com/public/photon-db-planet-master-latest.tar.bz2"
              echo "Esto puede llevar varias horas (56GB comprimido)..."
              wget -O - "https://download1.graphhopper.com/public/photon-db-planet-master-latest.tar.bz2" | \
                pbzip2 -cd | tar xf - -C /photon/photon_data
              echo "Importación completada."
              rm -f /photon/.initialized
          env:
            - name: DEBIAN_FRONTEND
              value: noninteractive
