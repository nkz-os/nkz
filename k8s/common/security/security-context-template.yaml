# =============================================================================
# Security Context - Configuración de Seguridad para Contenedores
# =============================================================================
# Estas configuraciones deben aplicarse a TODOS los deployments
# Siguen el principio de mínimo privilegio
# =============================================================================

---
# =============================================================================
# Template de Security Context - A nivel de Pod
# =============================================================================
# Aplicar a spec.template.spec.securityContext

# Security Context a nivel de Pod
podSecurityContext:
  # Ejecutar como usuario no root
  runAsNonRoot: true
  runAsUser: 1000      # UID del usuario
  runAsGroup: 1000     # GID del grupo
  fsGroup: 1000        # Grupo para volúmenes
  
  # Configuraciones adicionales de seguridad
  seccompProfile:
    type: RuntimeDefault  # Usa el perfil seccomp por defecto
  
  # Deshabilitar escalada de privilegios
  #fsGroupChangePolicy: "OnRootMismatch"  # Solo cambiar ownership si es necesario

---
# =============================================================================
# Template de Security Context - A nivel de Contenedor
# =============================================================================
# Aplicar a spec.template.spec.containers[].securityContext

containerSecurityContext:
  # Deshabilitar escalada de privilegios
  allowPrivilegeEscalation: false
  
  # Ejecutar como usuario no root
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  
  # Filesystem de solo lectura
  readOnlyRootFilesystem: true
  
  # Eliminar todas las capabilities
  capabilities:
    drop:
    - ALL
    # Añadir solo las capabilities necesarias (si aplica)
    # add:
    # - NET_BIND_SERVICE  # Solo si necesita binding a puertos < 1024
  
  # Perfil seccomp
  seccompProfile:
    type: RuntimeDefault

---
# =============================================================================
# ConfigMap con Security Context por tipo de servicio
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: security-contexts
  namespace: nekazari-system
  labels:
    app: nekazari
    component: security
data:
  # Para servicios de aplicación (APIs, microservicios)
  application-service.yaml: |
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL

  # Para bases de datos (requieren permisos de escritura en volúmenes)
  database-service.yaml: |
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999       # Usuario postgres estándar
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
    
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      readOnlyRootFilesystem: false  # Bases de datos necesitan escribir
      capabilities:
        drop:
        - ALL

  # Para Nginx (necesita binding a puerto 80)
  nginx-service.yaml: |
    podSecurityContext:
      runAsNonRoot: false  # Nginx en Alpine puede necesitar root inicialmente
      runAsUser: 101       # Usuario nginx en Alpine
      runAsGroup: 101
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: false
      runAsUser: 101
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
        add:
        - NET_BIND_SERVICE  # Para binding a puerto 80/443
        - CHOWN
        - SETGID
        - SETUID

  # Para Mosquitto (necesita permisos específicos)
  mosquitto-service.yaml: |
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1883      # Usuario mosquitto estándar
      runAsGroup: 1883
      fsGroup: 1883
      seccompProfile:
        type: RuntimeDefault
    
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1883
      runAsGroup: 1883
      readOnlyRootFilesystem: false  # Mosquitto necesita escribir logs/persistence
      capabilities:
        drop:
        - ALL

  # WireGuard VPN removed (2026-02-21) — replaced by Headscale (Tailscale).
  # No special security context needed; Tailscale runs as unprivileged user-space daemon.

---
# =============================================================================
# Script para actualizar deployments existentes
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: security-context-patcher
  namespace: nekazari-system
  labels:
    app: nekazari
    component: security-tools
data:
  apply-security-context.sh: |
    #!/bin/bash
    # Apply Security Context to deployments using kubectl get + apply
    # (NOT kubectl patch — patch --type='json' destroys envFrom references)
    #
    # PREFERRED APPROACH: Add securityContext directly to source YAML in gitops-config
    # or nkz/k8s templates. This script is a migration aid for existing deployments.
    set -euo pipefail

    NAMESPACE="${1:-nekazari}"
    SECURITY_TYPE="${2:-application}"

    echo "======================================"
    echo "Security Context Applier (get + apply)"
    echo "Namespace: $NAMESPACE"
    echo "Security type: $SECURITY_TYPE"
    echo "======================================"

    # Define security contexts
    case $SECURITY_TYPE in
      application)
        POD_CTX='{"runAsNonRoot":true,"runAsUser":1000,"runAsGroup":1000,"fsGroup":1000,"seccompProfile":{"type":"RuntimeDefault"}}'
        CONTAINER_CTX='{"allowPrivilegeEscalation":false,"runAsNonRoot":true,"runAsUser":1000,"runAsGroup":1000,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}}'
        ;;
      database)
        POD_CTX='{"runAsNonRoot":true,"runAsUser":999,"runAsGroup":999,"fsGroup":999,"seccompProfile":{"type":"RuntimeDefault"}}'
        CONTAINER_CTX='{"allowPrivilegeEscalation":false,"runAsNonRoot":true,"runAsUser":999,"runAsGroup":999,"readOnlyRootFilesystem":false,"capabilities":{"drop":["ALL"]}}'
        ;;
      *)
        echo "ERROR: Unknown security type: $SECURITY_TYPE"
        echo "Valid: application, database"
        exit 1
        ;;
    esac

    apply_to_deployment() {
      local dep="$1"
      echo "Processing $dep..."

      # Export current deployment
      kubectl get deployment "$dep" -n "$NAMESPACE" -o json > "/tmp/${dep}.json"

      # Check if security contexts already exist
      if jq -e '.spec.template.spec.securityContext' "/tmp/${dep}.json" >/dev/null 2>&1; then
        echo "  Skipping $dep: securityContext already present"
        rm "/tmp/${dep}.json"
        return
      fi

      # Add pod-level securityContext
      jq --argjson ctx "$POD_CTX" \
         '.spec.template.spec.securityContext = $ctx' \
         "/tmp/${dep}.json" > "/tmp/${dep}-patched.json"

      # Add container-level securityContext to first container
      jq --argjson ctx "$CONTAINER_CTX" \
         '.spec.template.spec.containers[0].securityContext = $ctx' \
         "/tmp/${dep}-patched.json" > "/tmp/${dep}-final.json"

      # Apply the modified deployment
      kubectl apply -f "/tmp/${dep}-final.json" -n "$NAMESPACE"
      echo "  Applied security context to $dep"

      rm "/tmp/${dep}.json" "/tmp/${dep}-patched.json" "/tmp/${dep}-final.json"
    }

    # Apply to all deployments in namespace (or specific ones via args)
    if [ $# -gt 2 ]; then
      shift 2
      for dep in "$@"; do
        if kubectl get deployment "$dep" -n "$NAMESPACE" &>/dev/null; then
          apply_to_deployment "$dep"
        else
          echo "Deployment $dep not found in $NAMESPACE"
        fi
      done
    else
      for dep in $(kubectl get deployments -n "$NAMESPACE" -o name | sed 's|deployment.apps/||'); do
        apply_to_deployment "$dep"
      done
    fi

    echo ""
    echo "Done. Verify with: kubectl get deployments -n $NAMESPACE -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.template.spec.containers[0].securityContext}{\"\\n\"}{end}'"
    echo ""
    echo "IMPORTANT: For permanent fix, add securityContext to source YAML in gitops-config"

  verify-security.sh: |
    #!/bin/bash
    # Script para verificar Security Context en deployments
    
    NAMESPACE="${1:-nekazari}"
    
    echo "======================================"
    echo "Security Context Verification"
    echo "Namespace: $NAMESPACE"
    echo "======================================"
    echo ""
    
    # Obtener todos los deployments
    deployments=$(kubectl get deployments -n $NAMESPACE -o name)
    
    total=0
    secure=0
    insecure=0
    
    for deployment in $deployments; do
      total=$((total + 1))
      name=$(echo $deployment | cut -d'/' -f2)
      
      # Verificar si tiene securityContext
      has_pod_security=$(kubectl get $deployment -n $NAMESPACE -o jsonpath='{.spec.template.spec.securityContext}')
      has_container_security=$(kubectl get $deployment -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].securityContext}')
      
      if [ -n "$has_pod_security" ] && [ -n "$has_container_security" ]; then
        echo "✅ $name - Security Context configurado"
        secure=$((secure + 1))
      else
        echo "❌ $name - Security Context FALTA"
        insecure=$((insecure + 1))
      fi
    done
    
    echo ""
    echo "======================================"
    echo "Resumen:"
    echo "Total: $total deployments"
    echo "Seguros: $secure"
    echo "Inseguros: $insecure"
    echo "======================================"
    
    if [ $insecure -gt 0 ]; then
      exit 1
    fi

---
# =============================================================================
# Job para aplicar Security Context automáticamente
# =============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: apply-security-contexts
  namespace: nekazari-system
  labels:
    app: nekazari
    component: security-setup
spec:
  template:
    spec:
      serviceAccountName: security-patcher-sa
      restartPolicy: OnFailure
      containers:
      - name: patcher
        image: bitnami/kubectl:1.32.3
        command: ["/bin/bash"]
        args:
          - /scripts/patch-deployments.sh
          - nekazari
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: security-context-patcher
          defaultMode: 0755

---
# ServiceAccount con permisos para parchear deployments
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-patcher-sa
  namespace: nekazari-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-patcher-role
  namespace: nekazari
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-patcher-binding
  namespace: nekazari
subjects:
- kind: ServiceAccount
  name: security-patcher-sa
  namespace: nekazari-system
roleRef:
  kind: Role
  name: security-patcher-role
  apiGroup: rbac.authorization.k8s.io
