---
# =============================================================================
# HPA - Frontend
# -----------------------------------------------------------------------------
# ⚠️  SUPERSEDED AND BROKEN. `scaleTargetRef` points at a Deployment named
# `frontend`, which no longer exists (it is `frontend-host`). Do not retarget it:
# `frontend-host` already has `frontend-host-hpa` in gitops-config, and a second
# HPA on one Deployment makes the two fight over replicas.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: nekazari
  labels:
    app: frontend
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

