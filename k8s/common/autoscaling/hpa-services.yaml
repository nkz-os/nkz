# =============================================================================
# Horizontal Pod Autoscalers - Servicios Críticos
# =============================================================================
# Configura auto-escalado basado en CPU y memoria para servicios críticos
#
# ⚠️  REFERENCE TEMPLATE — NOT APPLIED. Verified 2026-09-12: none of the HPAs
# below exist in the cluster. The ONLY live HPA is `frontend-host-hpa`, which is
# NOT in this file and is codified in gitops-config
# (overlays/core/frontend/frontend-host-hpa.yaml, CPU-only, min 2 / max 5).
# As with the rest of nkz/k8s, this tree is not the ArgoCD source — applying
# anything here by hand fights GitOps. Do not `kubectl apply -f` this file.
# =============================================================================

---
# =============================================================================
# HPA - API Gateway
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: nekazari
  labels:
    app: api-gateway
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Esperar 5 min antes de reducir
      policies:
      - type: Percent
        value: 50  # Reducir máximo 50% a la vez
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Escalar inmediatamente
      policies:
      - type: Percent
        value: 100  # Duplicar si es necesario
        periodSeconds: 15
      - type: Pods
        value: 4  # O añadir 4 pods
        periodSeconds: 15
      selectPolicy: Max  # Usar la política más agresiva

