server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Gateway
    location /api/ {
        proxy_pass http://api-gateway:5000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Proxy Keycloak
    # Proxy NGSI-LD
    location /ngsi-ld/ {
        proxy_pass http://api-gateway:5000/ngsi-ld/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Module Federation 2.0 bundles served from MinIO (anonymous read on bucket).
    # Developers publish a module via: mc cp dist/* minio/nekazari-frontend/modules/<id>/
    # The host then loads it via loadRemote('http://localhost:3000/modules/<id>/mf-manifest.json').
    location /modules/ {
        proxy_pass http://minio:9000/nekazari-frontend/modules/;
        proxy_set_header Host minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_intercept_errors off;
    }

    location = /config.js {
        add_header Cache-Control 'no-cache';
    }

    location /health {
        return 200 'OK';
    }
}
