server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config (written by apps/host/entrypoint.sh to /runtime, same as
    # production apps/host/nginx.conf). Fix: this override never served it, so
    # window.__ENV__ stayed empty and the app fell back to compiled defaults
    # (production Keycloak/API URLs) instead of the local-stack values the
    # entrypoint actually wrote. Do not remove.
    location = /__nkz_runtime__.js {
        root /runtime;
        add_header Cache-Control "no-store";
        types { } default_type application/javascript;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        # Inject the runtime config script (see location above) into <head> on
        # every HTML response, mirroring production nginx.conf's sub_filter.
        # Without this, the /__nkz_runtime__.js file exists but is never
        # wired into the page and window.__ENV__ never gets populated.
        sub_filter '</head>' '<script src="/__nkz_runtime__.js"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # Proxy API Gateway
    location /api/ {
        proxy_pass http://api-gateway:5000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Proxy Keycloak
    # Proxy NGSI-LD
    location /ngsi-ld/ {
        proxy_pass http://api-gateway:5000/ngsi-ld/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fix: nginx listens on 80 *inside* the container, so $server_port here
        # is 80, not the host-published port. Keycloak (KC_PROXY=edge) trusts
        # this header to build the token `iss`, so it issued
        # "http://localhost/auth/realms/..." (port 80 is default, omitted)
        # instead of "http://localhost:3000/auth/realms/...", which the
        # gateway's issuer whitelist requires. Hardcoded to 3000 (not derived
        # from $http_host) because this compose file already hardcodes that
        # same port elsewhere (docker-compose.yml `ports: "3000:80"` and
        # VITE_KEYCLOAK_URL=http://localhost:3000/auth) — this is a fixed
        # single-profile local dev stack, not a config that needs to handle
        # an arbitrary published port.
        proxy_set_header X-Forwarded-Port 3000;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Module Federation 2.0 bundles served from MinIO (anonymous read on bucket).
    # Developers publish a module via: mc cp dist/* minio/nekazari-frontend/modules/<id>/
    # The host then loads it via loadRemote('http://localhost:3000/modules/<id>/mf-manifest.json').
    location /modules/ {
        proxy_pass http://minio:9000/nekazari-frontend/modules/;
        proxy_set_header Host minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_intercept_errors off;
    }

    location = /config.js {
        add_header Cache-Control 'no-cache';
    }

    location /health {
        return 200 'OK';
    }
}
