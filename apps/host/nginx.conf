server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Runtime config (written by entrypoint to a writable emptyDir)
    location = /__nkz_runtime__.js {
        root /runtime;
        add_header Cache-Control "no-store";
        types { } default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Inject runtime + Cesium scripts at response time (root stays immutable)
        sub_filter '</head>' '<script src="/cesium/Cesium.js"></script><script src="/__nkz_runtime__.js"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
