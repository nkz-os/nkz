apiVersion: v2
name: nekazari
description: Nekazari Platform — FIWARE-based multi-tenant platform (AGPL-3.0)
type: application
version: 1.0.0-rc.1
appVersion: "1.0.0-rc.1"
keywords:
  - fiware
  - ngsi-ld
  - agriculture
  - iot
  - precision-farming
home: https://github.com/nkz-os/nkz
sources:
  - https://github.com/nkz-os/nkz
dependencies:
  - name: postgresql
    version: 1.0.0
    condition: postgresql.enabled
  - name: mongodb
    version: 1.0.0
    condition: mongodb.enabled
  - name: redis
    version: 1.0.0
    condition: redis.enabled
  - name: minio
    version: 1.0.0
    condition: minio.enabled
  - name: keycloak
    version: 1.0.0
    condition: keycloak.enabled
  - name: orion-ld
    version: 1.0.0
    condition: orion-ld.enabled
  - name: api-gateway
    version: 1.0.0
    condition: api-gateway.enabled
  - name: entity-manager
    version: 1.0.0
    condition: entity-manager.enabled
  - name: frontend
    version: 1.0.0
    condition: frontend.enabled
