apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headscale
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nkz-os/nkz
    targetRevision: HEAD
    path: k8s/vpn
    directory:
      exclude: '{02-headscale-config.yaml,04-headscale-ingress.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: nekazari
  # Production config + ingress: gitops-config vpn-config overlay.
  # Subnet router: 04-subnet-router.yaml (this app). Secret nekazari-iot-ca-secret is manual.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
