apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nkz-os/n8n-module-nkz
    targetRevision: HEAD
    path: k8s
    directory:
      exclude: '{secret-template.yaml,registration.sql}'
  destination:
    server: https://kubernetes.default.svc
    namespace: nekazari
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
